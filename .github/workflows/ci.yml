name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fatawa_user
          POSTGRES_PASSWORD: fatawa_password
          POSTGRES_DB: fatawa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Lint
      run: npm run lint
      
    - name: Build
      run: npm run build
      
    - name: Run Tests
      run: npm run test
      env:
        DATABASE_URL: postgresql://fatawa_user:fatawa_password@localhost:5432/fatawa_db?schema=public
        REDIS_URL: redis://localhost:6379
