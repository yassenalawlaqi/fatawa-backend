services:
  postgres:
    image: postgres:15-alpine
    container_name: fatawa_postgres_dev
    environment:
      POSTGRES_USER: fatawa_user
      POSTGRES_PASSWORD: fatawa_password
      POSTGRES_DB: fatawa_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fatawa_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data_dev: